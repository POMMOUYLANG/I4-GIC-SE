spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
    username: sa
    password:

shop:
  currency: "USD"
  tax-rate: 0.10
  low-stock-threshold: 15

logging:
  level:
    edu.itc.se.shop: DEBUG
    edu.itc.shop: DEBUG
    org.springframework.jdbc: DEBUG
